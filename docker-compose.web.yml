services:
  searxng:
    image: searxng/searxng:latest
    container_name: lah-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in the environment before starting SearXNG}
      - UWSGI_WORKERS=2
      - UWSGI_THREADS=4
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/cache/uwsgi:size=32m
      - /var/run:size=16m
    networks:
      - lah-web
networks:
  lah-web:
    driver: bridge
