services:
  searxng:
    image: searxng/searxng:latest
    container_name: lah-searxng
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in the environment before starting SearXNG}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run:size=16m
    networks:
      - lah-web
volumes:
  searxng-cache:
networks:
  lah-web:
    driver: bridge
